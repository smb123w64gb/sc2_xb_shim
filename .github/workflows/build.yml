name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Win32 (x86)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Win32 / ClangCL)
        run: cmake -B build -A Win32 -T ClangCL

      - name: Build Release Binaries
        run: cmake --build build --config Release

      - name: Package Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin/NativeSC2.exe" "dist/NativeSC2.exe"
          Copy-Item "bin/NativeSC2_core.dll" "dist/NativeSC2_core.dll"
          if (Test-Path "README.md") {
            Copy-Item "README.md" "dist/README.md"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "sc2_xb_shim-win32.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc2_xb_shim-win32
          path: |
            bin/NativeSC2.exe
            bin/NativeSC2_core.dll
            sc2_xb_shim-win32.zip

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sc2_xb_shim-win32.zip
            bin/NativeSC2.exe
            bin/NativeSC2_core.dll
          generate_release_notes: true
